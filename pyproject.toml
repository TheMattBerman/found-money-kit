[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "found-money-kit"
version = "0.1.0"
description = "Local, approval-only lifecycle recovery analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "openai>=1.0,<2",
  "pillow>=10.0,<12",
  "playwright>=1.50,<2",
  "pydantic>=2.8,<3",
  "pypdf>=5.0,<7",
  "pypdfium2>=4.30,<5",
]

[dependency-groups]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "ruff>=0.6,<1",
]

[project.scripts]
found-money = "found_money.__main__:main"

[tool.setuptools]
packages = [
  "found_money",
  "found_money.activation",
  "found_money.connectors",
  "found_money.contracts",
  "found_money.events",
  "found_money.identity",
  "found_money.imports",
  "found_money.map",
  "found_money.rendering",
  "found_money.ranking",
  "found_money.safety",
  "found_money.scenarios",
  "found_money.strategy",
  "found_money.value",
]

[tool.setuptools.package-data]
"found_money.rendering" = ["templates/*.html", "static/*", "static/**/*"]
"found_money.scenarios" = ["fixtures/**/*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
files = ["found_money"]
check_untyped_defs = true
warn_unused_ignores = true
